<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FURIA Fan Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <header class="cabecalho">
      <h1>🔥 FURIA Fan Chat 🔥</h1>
      <img src="/Imagens/furia-esports-logo-png.png" alt="Logo da FURIA" class="logo">
    </header>

    <aside class="lateral esquerda">
    </aside>

    <main class="centro">
      <div id="chat-box"></div>
      <div id="input-area">
        <input type="text" id="user-input" placeholder="Digite sua mensagem ou comando (ex: /agenda)">
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </main>

    <aside class="lateral direita">
    </aside>

    <footer class="rodape">
      <p>© 2025 FURIA Fan Chat - Projeto demonstrativo para desafio</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
